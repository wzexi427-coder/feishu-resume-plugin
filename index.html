<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>简历筛选助手</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; background: #f5f6f7; margin: 0; }
        .container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #1f2329; font-size: 18px; }
        .btn { 
            background: #3370ff; color: white; border: none; padding: 10px 20px; 
            border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 10px;
        }
        .btn:hover { background: #2860d9; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 15px; padding: 12px; border-radius: 4px; font-size: 14px; }
        .status.success { background: #e6f7e6; color: #1a7f1a; border: 1px solid #a3e6a3; }
        .status.error { background: #ffe6e6; color: #cc0000; border: 1px solid #ffb3b3; }
        .status.info { background: #e6f0ff; color: #1a4db3; border: 1px solid #b3d1ff; }
        .log { margin-top: 15px; max-height: 300px; overflow-y: auto; background: #f8f9fa; padding: 10px; border-radius: 4px; font-size: 12px; font-family: monospace; }
        .log-item { margin: 4px 0; padding: 4px; border-left: 3px solid #3370ff; padding-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 AI 简历筛选助手</h2>
        <p style="color: #666; font-size: 14px;">自动对比姓名与本周飞书日历，更新招聘状态</p>
        
        <div style="margin: 20px 0;">
            <button class="btn" id="checkBtn" disabled>检查当前选中行</button>
            <button class="btn" id="autoBtn" disabled>开启自动模式（监听新增）</button>
        </div>

        <div id="status" class="status info" style="display: none;"></div>
        
        <div class="log" id="log">
            <div class="log-item">正在初始化...</div>
        </div>
    </div>

    <script>
        // 使用飞书 Base 官方全局对象
        const BASE_URL = 'http://localhost:3000';
        let autoMode = false;
        let processedIds = new Set();

        function addLog(msg, type) {
            const log = document.getElementById('log');
            const item = document.createElement('div');
            item.className = 'log-item';
            item.style.borderLeftColor = type === 'success' ? '#1a7f1a' : type === 'error' ? '#cc0000' : '#3370ff';
            item.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            log.insertBefore(item, log.firstChild);
        }

        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + (type || 'info');
            status.style.display = 'block';
        }

        // 检查当前选中的记录
        async function checkCurrentRecord() {
            try {
                showStatus('正在获取选中行...', 'info');
                
                // 获取当前激活的表格
                const base = bitable.base;
                const table = await base.getTableById(bitable.base.id);
                
                // 获取选中记录
                const selection = await base.getSelection();
                if (!selection || !selection.recordId) {
                    showStatus('请先点击选中表格中的一行！', 'error');
                    return;
                }

                const recordId = selection.recordId;
                addLog('选中记录: ' + recordId);

                // 获取记录详情
                const record = await table.getRecordById(recordId);
                const fields = record.fields || {};
                
                // 获取姓名
                const nameField = fields['姓名'];
                let name = '';
                if (Array.isArray(nameField) && nameField[0]) {
                    name = nameField[0].text || nameField[0] || '';
                } else {
                    name = nameField || '';
                }
                
                if (!name) {
                    showStatus('该记录的"姓名"字段为空！', 'error');
                    return;
                }

                addLog('提取姓名: ' + name);
                showStatus('正在检查 "' + name + '" 是否在本周日历中...', 'info');
                
                // 调用后端检查
                const res = await fetch(BASE_URL + '/check-name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                addLog('日历匹配结果: ' + (data.matched ? '✅ 找到' : '❌ 未找到'), data.matched ? 'success' : 'info');
                addLog('建议状态: ' + data.status, data.matched ? 'success' : 'info');

                // 更新状态字段
                await table.setRecord(recordId, {
                    '状态': data.status
                });
                
                showStatus('✅ 已更新 "' + name + '" 的状态为: ' + data.status, 'success');
                addLog('✅ 成功更新状态: ' + name + ' → ' + data.status, 'success');

            } catch (error) {
                showStatus('❌ 错误: ' + error.message, 'error');
                addLog('❌ 错误: ' + error.message, 'error');
                console.error(error);
            }
        }

        // 开启自动监听模式
        async function enableAutoMode() {
            if (autoMode) return;
            autoMode = true;
            document.getElementById('autoBtn').textContent = '自动模式运行中...';
            document.getElementById('autoBtn').disabled = true;
            showStatus('🟢 自动模式已开启，将监听新增记录...', 'success');
            addLog('🟢 自动模式启动，开始监听...', 'success');

            const base = bitable.base;
            const table = await base.getTableById(bitable.base.id);

            setInterval(async function() {
                try {
                    const records = await table.getRecords({ pageSize: 50 });
                    
                    for (let i = 0; i < records.records.length; i++) {
                        const record = records.records[i];
                        if (!processedIds.has(record.id)) {
                            processedIds.add(record.id);
                            
                            // 检查状态是否为空（视为新增）
                            const fields = record.fields || {};
                            const currentStatus = fields['状态'];
                            
                            if (!currentStatus) {
                                const nameField = fields['姓名'];
                                let name = '';
                                if (Array.isArray(nameField) && nameField[0]) {
                                    name = nameField[0].text || nameField[0] || '';
                                } else {
                                    name = nameField || '';
                                }
                                
                                if (name) {
                                    addLog('🆕 检测到新记录: ' + name, 'info');
                                    const res = await fetch(BASE_URL + '/check-name', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ name: name })
                                    });
                                    const data = await res.json();
                                    
                                    await table.setRecord(record.id, {
                                        '状态': data.status
                                    });
                                    
                                    addLog('✅ 自动更新: ' + name + ' → ' + data.status, 'success');
                                }
                            }
                        }
                    }
                } catch (e) {
                    addLog('⚠️ 自动检查错误: ' + e.message, 'error');
                }
            }, 5000);
        }

        // 初始化
        async function init() {
            try {
                addLog('正在检查环境...', 'info');
                
                // 检查 bitable 对象是否存在
                if (typeof bitable === 'undefined') {
                    throw new Error('未在飞书环境中运行，bitable 对象不存在');
                }
                
                addLog('✅ 发现 bitable 对象', 'success');
                
                // 获取 base 和 table
                const base = bitable.base;
                if (!base) {
                    throw new Error('无法获取 base 对象');
                }
                
                addLog('✅ 已连接到 Base', 'success');
                
                // 获取表格信息
                const table = await base.getActiveTable();
                if (!table) {
                    throw new Error('无法获取当前表格');
                }
                
                addLog('✅ 已获取表格', 'success');
                
                // 加载现有记录ID
                const records = await table.getRecords({ pageSize: 500 });
                for (let i = 0; i < records.records.length; i++) {
                    processedIds.add(records.records[i].id);
                }
                addLog('✅ 初始化完成，已加载 ' + processedIds.size + ' 条现有记录', 'success');
                
                // 启用按钮
                document.getElementById('checkBtn').disabled = false;
                document.getElementById('autoBtn').disabled = false;
                
                // 绑定按钮事件
                document.getElementById('checkBtn').onclick = checkCurrentRecord;
                document.getElementById('autoBtn').onclick = enableAutoMode;
                
            } catch (e) {
                addLog('❌ 初始化失败: ' + e.message, 'error');
                console.error(e);
            }
        }

        // 页面加载完成后执行初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
